name: deploy

on:
  push:
    paths-ignore:
      - "LICENSE"
      - "README.md"
      - ".gitignore"
    branches:
      - main
  workflow_dispatch:

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

# Default to bash
defaults:
  run:
    shell: bash

permissions: {}
cache-mode: none

jobs:
  deployment-check:
    permissions:
      contents: read
      deployments: read
    runs-on: ubuntu-latest
    outputs: # set outputs for use in downstream jobs
      sha: ${{ steps.deployment-check.outputs.sha }}
      continue: ${{ steps.deployment-check.outputs.continue }}

    steps:
      - uses: openai/fence@530cce8d45da60a7c353da45511639ad5e154e9a # pin@v0.10.1

      # https://github.com/github/branch-deploy/blob/d3c24bd92505e623615b75ffdfac5ed5259adbdb/docs/merge-commit-strategy.md
      - name: deployment check
        uses: grantbirki/branch-deploy@a7a7ea40a15a79a036322c2924ab74f5eded702c # pin@v12.1.0
        id: deployment-check
        with:
          merge_deploy_mode: "true"
          environment: github-pages

  # Candidate scripts, dependencies, configuration, and imports run only here.
  build:
    needs: deployment-check
    if: ${{ needs.deployment-check.outputs.continue == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: openai/fence@530cce8d45da60a7c353da45511639ad5e154e9a # pin@v0.10.1
        with:
          mode: audit
          allowlist: |
            hostname registry.npmjs.org tcp 443

      - name: validate selected revision
        env:
          SELECTED_SHA: ${{ needs.deployment-check.outputs.sha }}
        run: '[[ "$SELECTED_SHA" =~ ^[0-9a-f]{40}$ ]]'

      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v6
        with:
          ref: ${{ needs.deployment-check.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: verify selected checkout
        env:
          SELECTED_SHA: ${{ needs.deployment-check.outputs.sha }}
        run: 'test "$(git rev-parse HEAD)" = "$SELECTED_SHA"'

      - name: setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # pin@v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: bootstrap
        run: script/bootstrap

      - name: build
        run: script/build
        env:
          VITE_SITE_URL: https://stickers.birki.io

      - name: archive site
        run: tar --format=posix -cf "$RUNNER_TEMP/site.tar" -C dist .

      - name: upload build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # pin@v7.0.1
        with:
          name: site-${{ github.run_attempt }}-${{ needs.deployment-check.outputs.sha }}
          path: ${{ runner.temp }}/site.tar
          if-no-files-found: error
          retention-days: 1

  # A fresh runner treats the candidate archive strictly as static files.
  prepare:
    needs: [deployment-check, build]
    if: ${{ needs.deployment-check.outputs.continue == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: openai/fence@530cce8d45da60a7c353da45511639ad5e154e9a # pin@v0.10.1
        with:
          allow_github_artifacts: true

      - name: checkout trusted packaging
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: verify trusted checkout
        env:
          TRUSTED_SHA: ${{ github.sha }}
        run: |
          [[ "$TRUSTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$TRUSTED_SHA"

      - name: download build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # pin@v8.0.1
        with:
          name: site-${{ github.run_attempt }}-${{ needs.deployment-check.outputs.sha }}
          path: ${{ runner.temp }}/site-input

      - name: prepare static files
        env:
          SELECTED_SHA: ${{ needs.deployment-check.outputs.sha }}
          TRUSTED_SHA: ${{ github.sha }}
        run: python3 .github/scripts/prepare-pages.py "$RUNNER_TEMP/site-input/site.tar" "$RUNNER_TEMP/site-output" "$SELECTED_SHA" "$TRUSTED_SHA"

      - name: upload pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # pin@v5.0.0
        with:
          name: pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/site-output

  deploy:
    needs: [deployment-check, build, prepare]
    if: ${{ needs.deployment-check.outputs.continue == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: openai/fence@530cce8d45da60a7c353da45511639ad5e154e9a # pin@v0.10.1

      - name: deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # pin@v5.0.0
        with:
          artifact_name: pages-${{ github.run_id }}-${{ github.run_attempt }}

name: branch deploy

# The workflow to execute on is comments that are newly created
on:
  issue_comment:
    types: [ created ]

permissions: {}
cache-mode: none

# set an environment variable for use in the jobs pointing to my site
env:
  web_url: https://stickers.birki.io

jobs:
  # branch-deploy trigger job
  trigger:
    if: # only run on pull request comments and very specific comment body string as defined in our branch-deploy settings
      ${{ github.event.issue.pull_request &&
      contains(fromJSON('["OWNER", "MEMBER"]'), github.event.comment.author_association) &&
      (contains(github.event.comment.body, '.deploy') ||
      contains(github.event.comment.body, '.lock') ||
      contains(github.event.comment.body, '.noop') ||
      contains(github.event.comment.body, '.help') ||
      contains(github.event.comment.body, '.wcid') ||
      contains(github.event.comment.body, '.unlock')) }}
    permissions:
      contents: write
      deployments: write
      pull-requests: write
      checks: read
      statuses: read
      actions: read
    runs-on: ubuntu-latest
    outputs: # set outputs for use in downstream jobs
      context: ${{ steps.branch-deploy.outputs.context }}
      continue: ${{ steps.branch-deploy.outputs.continue }}
      noop: ${{ steps.branch-deploy.outputs.noop }}
      deployment_id: ${{ steps.branch-deploy.outputs.deployment_id }}
      environment: ${{ steps.branch-deploy.outputs.environment }}
      ref: ${{ steps.branch-deploy.outputs.ref }}
      sha: ${{ steps.branch-deploy.outputs.sha }}
      comment_id: ${{ steps.branch-deploy.outputs.comment_id }}
      initial_reaction_id: ${{ steps.branch-deploy.outputs.initial_reaction_id }}
      actor_handle: ${{ steps.branch-deploy.outputs.actor_handle }}

    steps:
      - uses: openai/fence@e6b39c80c51cb2b2a39448ddeff74b3b886c0a63 # pin@v0.10.0

      # execute the branch-deploy action
      - uses: grantbirki/branch-deploy@a7a7ea40a15a79a036322c2924ab74f5eded702c # pin@v12.1.0
        id: branch-deploy
        with:
          trigger: ".deploy"
          environment: "github-pages"
          production_environments: "github-pages"
          skip_completing: "true" # we will complete the deployment manually in the 'result' job
          admins: "GrantBirki"

  # Candidate scripts, dependencies, configuration, and imports run only here.
  build:
    needs: trigger
    if: ${{ needs.trigger.outputs.continue == 'true' && fromJSON(needs.trigger.outputs.context).run_attempt == github.run_attempt }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: openai/fence@e6b39c80c51cb2b2a39448ddeff74b3b886c0a63 # pin@v0.10.0
        with:
          mode: audit
          allowlist: |
            hostname registry.npmjs.org tcp 443

      - name: validate selected revision
        env:
          SELECTED_SHA: ${{ needs.trigger.outputs.sha }}
        run: '[[ "$SELECTED_SHA" =~ ^[0-9a-f]{40}$ ]]'

      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v6
        with:
          ref: ${{ needs.trigger.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: verify selected checkout
        env:
          SELECTED_SHA: ${{ needs.trigger.outputs.sha }}
        run: 'test "$(git rev-parse HEAD)" = "$SELECTED_SHA"'

      - name: setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # pin@v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: bootstrap
        run: script/bootstrap

      - name: build
        run: script/build
        env:
          VITE_SITE_URL: https://stickers.birki.io

      - name: archive site
        run: tar --format=posix -cf "$RUNNER_TEMP/site.tar" -C dist .

      - name: upload build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # pin@v7.0.1
        with:
          name: site-${{ github.run_attempt }}-${{ needs.trigger.outputs.sha }}
          path: ${{ runner.temp }}/site.tar
          if-no-files-found: error
          retention-days: 1

  # A fresh runner treats the candidate archive strictly as static files.
  prepare:
    needs: [trigger, build]
    if: ${{ needs.trigger.outputs.continue == 'true' && fromJSON(needs.trigger.outputs.context).run_attempt == github.run_attempt }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: openai/fence@e6b39c80c51cb2b2a39448ddeff74b3b886c0a63 # pin@v0.10.0
        with:
          allow_github_artifacts: true

      - name: checkout trusted packaging
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: verify trusted checkout
        env:
          TRUSTED_SHA: ${{ github.sha }}
        run: |
          [[ "$TRUSTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$TRUSTED_SHA"

      - name: download build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # pin@v8.0.1
        with:
          name: site-${{ github.run_attempt }}-${{ needs.trigger.outputs.sha }}
          path: ${{ runner.temp }}/site-input

      - name: prepare static files
        env:
          SELECTED_SHA: ${{ needs.trigger.outputs.sha }}
          TRUSTED_SHA: ${{ github.sha }}
        run: python3 .github/scripts/prepare-pages.py "$RUNNER_TEMP/site-input/site.tar" "$RUNNER_TEMP/site-output" "$SELECTED_SHA" "$TRUSTED_SHA"

      - name: upload pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # pin@v5.0.0
        with:
          name: pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/site-output

  deploy:
    needs: [trigger, build, prepare]
    if: ${{ needs.trigger.outputs.continue == 'true' && fromJSON(needs.trigger.outputs.context).run_attempt == github.run_attempt && needs.trigger.outputs.noop != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      deployment: false
    steps:
      - uses: openai/fence@e6b39c80c51cb2b2a39448ddeff74b3b886c0a63 # pin@v0.10.0

      - name: deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # pin@v5.0.0
        with:
          artifact_name: pages-${{ github.run_id }}-${{ github.run_attempt }}

  result:
    needs: [trigger, build, prepare, deploy]
    if: ${{ always() && needs.trigger.outputs.continue == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      deployments: write
      pull-requests: write
    steps:
      - uses: openai/fence@e6b39c80c51cb2b2a39448ddeff74b3b886c0a63 # pin@v0.10.0

      - name: complete deployment
        uses: grantbirki/branch-deploy@a7a7ea40a15a79a036322c2924ab74f5eded702c # pin@v12.1.0
        with:
          result_mode: true
          context: ${{ needs.trigger.outputs.context }}
          job_results: ${{ needs.trigger.outputs.noop == 'true' && format('["{0}","{1}","{2}"]', needs.trigger.result, needs.build.result, needs.prepare.result) || toJSON(needs.*.result) }}
          result_url: ${{ env.web_url }}

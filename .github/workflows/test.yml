name: test

on:
  push:
    branches:
      - main
  pull_request:
    branches: [ main ]

permissions:
  contents: read

cache-mode: none

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: fence
        if: runner.environment == 'github-hosted' && runner.os == 'Linux' && runner.arch == 'X64'
        uses: openai/fence@7cba9082252803421a0e433f29198de6d0063221 # pin@v0.13.1
        with:
          allowlist: |
            hostname registry.npmjs.org tcp 443

      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # pin@v7.0.0
        with:
          package-manager-cache: false
          node-version-file: .node-version

      - name: bootstrap
        run: script/bootstrap

      - name: test
        run: script/test

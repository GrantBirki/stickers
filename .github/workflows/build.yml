name: build

on:
  push:
    branches:
      - main
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: openai/fence@e6b39c80c51cb2b2a39448ddeff74b3b886c0a63 # pin@v0.10.0
        with:
          allowlist: |
            hostname registry.npmjs.org tcp 443

      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v6

      - name: test pages packaging
        run: python3 -m unittest discover -s .github/scripts -p "test_*.py"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # pin@v7.0.0
        with:
          node-version-file: .node-version
          cache: 'npm'

      - name: bootstrap
        run: script/bootstrap

      - name: build
        run: script/build
        env:
          VITE_SITE_URL: https://stickers.birki.io
